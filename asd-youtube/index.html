    <h1>ASD YouTube</h1>
    <p>ASD YouTubeは、所有者本人のMacで動く動画投稿ツールです。Finderの「ダウンロード」にある「ASD YouTubeアップロード」に置いた動画を本人のYouTubeチャンネルに投稿し、処理が終わると本人のLINEに通知します。</p>
    <p>「非公開」フォルダの動画は非公開、「限定公開」フォルダの動画は限定公開で投稿します。限定公開のURLを共有する相手は所有者が決めます。</p>
    <p>Googleの許可画面は、動画のアップロードと、投稿先・処理状況・公開範囲の確認のために使用します。</p>
    <p><a href="privacy.html">プライバシーポリシー</a></p>
  </main>
