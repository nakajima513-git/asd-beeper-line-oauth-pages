    <h1>ASD Beeper LINE Drive Sync</h1>
    <p>このアプリは、所有者本人がMacに保存したLINE会話アーカイブを、本人のGoogle Driveへ同期するためのデスクトップ用ツールです。一般向けのサービスや公開ログイン機能はありません。</p>
    <p>Google Driveへの読み書き権限は、既存の保存フォルダを確認して差分同期するために使用します。保存先の共有設定は、このアプリから変更しません。LINEの送信や既読の操作も行いません。</p>
